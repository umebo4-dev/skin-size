<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #eee;
    }
    #status {
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .idle    { background: #0f3460; }
    .tracing { background: #c0392b; }
    button {
      width: 100%;
      padding: 7px;
      border: none;
      border-radius: 5px;
      background: #e94560;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button:disabled { background: #555; cursor: default; }
  </style>
</head>
<body>
  <div id="status" class="idle">待機中</div>
  <div id="counter" style="text-align:center; font-size:12px; color:#aaa; margin-bottom:8px;">0 / 10</div>
  <button id="resetBtn">カウントリセット</button>
  <script src="popup.js"></script>
</body>
</html>
